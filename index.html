<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="MusicKulay.css">
    <title>Wicked Games - Music Player</title>
</head>
<body>
  <main class="player-card">
    <div class="album-art" role="img" aria-label="House of Balloons album art"></div>

    <p class="track-title">Wicked Games</p>
    <p class="track-artist">The Weeknd</p>

    <audio id="audioPlayer" preload="metadata">
      <source src="WickedGames.mp3" type="audio/mpeg">
      Your browser does not support audio playback.
    </audio>

    <div class="progress">
      <label class="sr-only" for="seekBar">Seek through Wicked Games</label>
      <input id="seekBar" type="range" min="0" max="0" value="0" step="0.1" disabled>
      <div class="time-display" aria-live="off">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="controls" aria-label="Playback controls">
      <button id="restartButton" type="button" aria-label="Restart track" title="Restart">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-4.9 6H5.02A7 7 0 1 0 12 5z"/></svg>
      </button>
      <button id="backButton" type="button" aria-label="Back 10 seconds" title="Back 10 seconds">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
      </button>
      <button id="playButton" class="play-btn" type="button" aria-label="Play" title="Play">
        <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="forwardButton" type="button" aria-label="Forward 10 seconds" title="Forward 10 seconds">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 6v12l8.5-6-8.5-6zM4.5 18l8.5-6-8.5-6z"/></svg>
      </button>
      <button id="endButton" type="button" aria-label="Go to end of track" title="Go to end">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h2v12H5zm3.5 6l8.5 6V6l-8.5 6zM19 6h2v12h-2z"/></svg>
      </button>
    </div>
    <p id="playerMessage" class="player-message" role="status" aria-live="polite"></p>
  </main>

  <script>
    const audio = document.getElementById("audioPlayer");
    const seekBar = document.getElementById("seekBar");
    const currentTimeDisplay = document.getElementById("currentTime");
    const durationDisplay = document.getElementById("duration");
    const playButton = document.getElementById("playButton");
    const playIcon = document.getElementById("playIcon");
    const playerMessage = document.getElementById("playerMessage");

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";
      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = Math.floor(seconds % 60);
      return `${minutes}:${String(remainingSeconds).padStart(2, "0")}`;
    }

    function updatePlayButton() {
      const isPlaying = !audio.paused;
      playButton.setAttribute("aria-label", isPlaying ? "Pause" : "Play");
      playButton.title = isPlaying ? "Pause" : "Play";
      playIcon.innerHTML = isPlaying
        ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
        : '<path d="M8 5v14l11-7z"/>';
    }

    audio.addEventListener("loadedmetadata", () => {
      seekBar.max = audio.duration;
      seekBar.disabled = false;
      durationDisplay.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("timeupdate", () => {
      if (!seekBar.matches(":active")) seekBar.value = audio.currentTime;
      currentTimeDisplay.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener("play", updatePlayButton);
    audio.addEventListener("pause", updatePlayButton);
    audio.addEventListener("ended", updatePlayButton);
    audio.addEventListener("error", () => {
      playerMessage.textContent = "Could not load the audio file. Check that WickedGames.mp3 is in this folder.";
    });

    playButton.addEventListener("click", async () => {
      playerMessage.textContent = "";
      if (audio.paused) {
        try {
          await audio.play();
        } catch {
          playerMessage.textContent = "Playback could not start. Try opening this page in a different browser.";
        }
      } else {
        audio.pause();
      }
    });

    seekBar.addEventListener("input", () => {
      audio.currentTime = Number(seekBar.value);
      currentTimeDisplay.textContent = formatTime(audio.currentTime);
    });

    document.getElementById("restartButton").addEventListener("click", () => {
      audio.currentTime = 0;
    });

    document.getElementById("backButton").addEventListener("click", () => {
      audio.currentTime = Math.max(0, audio.currentTime - 10);
    });

    document.getElementById("forwardButton").addEventListener("click", () => {
      audio.currentTime = Math.min(audio.duration || audio.currentTime, audio.currentTime + 10);
    });

    document.getElementById("endButton").addEventListener("click", () => {
      if (Number.isFinite(audio.duration)) audio.currentTime = audio.duration;
    });
  </script>
</body>
</html>
